<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Ridge Plants</title>
<meta name="description" content="Bilingual field guide to plants of Asheville, Boone and the Blue Ridge Parkway, for a November visit.">
<meta name="theme-color" content="#2D4A3F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blue Ridge">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,500;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --fog:#E7ECE9; --paper:#F7F9F7; --ink:#1B2622; --ink2:#4A5A54; --rule:#C3CDC8;
  --spruce:#2D4A3F; --spruce-soft:#DCE6E0; --lichen:#C9D3B2; --hazel:#E0A92A; --hazel-soft:#F6E3B3;
  --bud:#6E3B5C; --bud-soft:#EADCE5; --track:#D5DDD9;
  --sans:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root{ --fog:#111816; --paper:#18221E; --ink:#E2E9E5; --ink2:#A7B6AF; --rule:#2E3B36;
    --spruce:#9CC4B4; --spruce-soft:#21302A; --lichen:#3A4A35; --hazel:#E8B640; --hazel-soft:#3D3217;
    --bud:#D9A2C6; --bud-soft:#3A2534; --track:#26332E; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fog);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
a{color:var(--spruce);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--hazel);outline-offset:2px}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-family:var(--serif);font-weight:500;font-size:1.75rem}
h2{font-family:var(--serif);font-weight:500;font-size:1.35rem;margin:1.6rem 0 .5rem}
h3{font-size:1rem;font-weight:700;margin:1.1rem 0 .25rem}
p{margin:.35rem 0}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* language visibility */
body.l-en .es, body.l-es .en{display:none !important}
.blk{display:block}
body.l-both p.es, body.l-both .blk.es{color:var(--ink2);border-left:2px solid var(--rule);padding-left:.6rem;margin-top:.2rem}
body.l-both span.es.alt::before{content:" / ";color:var(--ink2)}
body.l-both span.es.alt{color:var(--ink2)}
.es{font-style:normal}
body.l-both .tabs .es{display:none}
[id]{scroll-margin-top:72px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--spruce);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px}
@media (prefers-color-scheme: dark){.top{background:#1D302A}}
.top .row{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{color:#fff;text-decoration:none;font-family:var(--serif);font-size:1.15rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand i{font-style:italic}
.langs{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:8px;overflow:hidden;flex:none}
.langs button{background:none;border:0;color:#fff;padding:6px 10px;font-size:.85rem;min-height:36px;cursor:pointer}
.langs button[aria-pressed="true"]{background:#fff;color:var(--spruce);font-weight:700}
@media (prefers-color-scheme: dark){.langs button[aria-pressed="true"]{color:#1D302A}}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;max-width:136px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;text-decoration:none;color:var(--ink2);font-size:.78rem;min-height:var(--nav-h)}
.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--spruce);font-weight:700}
main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}

/* intro band */
.intro{background:var(--paper);border-bottom:1px solid var(--rule);padding:18px 0 14px}
.intro h1{margin-bottom:.35rem}
.nowline{display:flex;gap:10px;align-items:flex-start;margin-top:.6rem}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--hazel);margin-top:.4rem;box-shadow:0 0 0 3px var(--hazel-soft)}

/* filters */
.search{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);margin:14px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--rule);background:var(--paper);border-radius:999px;padding:7px 13px;font-size:.9rem;min-height:40px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--spruce);border-color:var(--spruce);color:var(--paper);font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;font-size:.95rem;padding:4px 0 8px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--hazel)}
.count{color:var(--ink2);font-size:.9rem;margin:.2rem 0 .6rem}

/* species index */
.group h2{margin-top:1.4rem}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list li{border-bottom:1px solid var(--rule)}
.list a{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:10px 0;text-decoration:none;color:inherit;min-height:84px}
.thumb{width:72px;height:72px;border-radius:6px;background:var(--track) center/cover no-repeat;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:1.4rem}
.nm{font-weight:700;line-height:1.25}
.nm .es.alt{font-weight:400}
.sci{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:.98rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:.75rem;padding:1px 8px;border-radius:4px;background:var(--spruce-soft);color:var(--ink)}
.tag.r{background:var(--bud-soft);color:var(--bud);font-weight:700}
.tag.n{background:var(--hazel-soft)}
.seenmark{width:22px;height:22px;color:var(--spruce)}
.compare{margin:.4rem 0 .8rem;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:2px 12px}
.compare summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--spruce)}
.compare svg{width:100%;height:auto}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;padding:12px 0;text-decoration:none;font-weight:700;min-height:44px}
.hero{position:relative;margin:0 -16px;background:var(--track);aspect-ratio:4/3;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .credit{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 6px;font-size:.72rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.hero .credit a{color:#fff}
.hero .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink2);text-align:center;padding:20px;font-size:.95rem}
.title{padding:14px 0 4px}
.title h1{font-size:1.6rem;font-family:var(--sans);font-weight:700}
.title .es.alt{display:block;font-weight:400;font-size:1.2rem}
body.l-both .title .es.alt::before{content:""}
.title .bin{font-family:var(--serif);font-style:italic;font-size:1.35rem;margin-top:.2rem}
.label{border:1.5px solid var(--ink);border-radius:3px;background:var(--paper);padding:10px 12px;margin:12px 0;font-size:.95rem}
.label dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.label dt{color:var(--ink2)}
.label dd{margin:0}
.code{display:inline-block;padding:1px 8px;border-radius:4px;font-weight:700;font-size:.9rem}
.code.X{background:var(--bud-soft);color:var(--bud)}
.code.P{background:var(--spruce-soft);color:var(--spruce)}
.code.B{background:var(--hazel-soft);color:var(--ink)}
.now{background:var(--hazel);color:#1B2622;margin:14px -16px;padding:14px 16px 12px}
.now h2{font-family:var(--sans);font-weight:700;font-size:1.05rem;margin:0 0 .3rem}
.now p.es{color:#3B3420 !important;border-left-color:rgba(0,0,0,.25) !important}
.now.off{background:var(--track);color:var(--ink)}
.now.off p.es{color:var(--ink2) !important}
.field h3{color:var(--spruce)}
.gal-head{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:7px 12px;min-height:40px;font-size:.9rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--spruce);color:var(--paper);font-weight:700}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 0 4px}
.gal button{padding:0;border:0;background:var(--track);aspect-ratio:1;overflow:hidden;cursor:zoom-in;border-radius:3px}
.gal img{width:100%;height:100%;object-fit:cover}
.note{font-size:.85rem;color:var(--ink2)}
.links{list-style:none;padding:0;margin:.4rem 0}
.links li{border-bottom:1px solid var(--rule)}
.links a{display:flex;justify-content:space-between;gap:10px;padding:12px 0;min-height:44px;text-decoration:none;font-weight:700}
.links a span.host{font-weight:400;color:var(--ink2);font-size:.85rem;text-align:right}
.mine{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px;margin:12px 0}
.mine textarea{width:100%;min-height:96px;font:inherit;padding:10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--fog);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--spruce);background:var(--spruce);color:var(--paper);border-radius:8px;padding:10px 16px;min-height:44px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--spruce)}
.prog{height:10px;background:var(--track);border-radius:5px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;width:0;background:var(--hazel);transition:width .2s}

/* generic blocks */
.blocks{list-style:none;margin:0;padding:0}
.blocks>li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin:10px 0}
.blocks h3{margin-top:0;font-size:1.05rem}
.meta{font-size:.9rem;color:var(--ink2);margin:.15rem 0 .4rem}
.splinks{display:flex;flex-wrap:wrap;gap:6px;margin:.5rem 0}
.splinks a{font-size:.85rem;padding:3px 9px;border-radius:999px;background:var(--spruce-soft);text-decoration:none;color:var(--ink)}
.splinks a.n{background:var(--hazel-soft)}
.maplinks{display:flex;gap:14px;flex-wrap:wrap;margin-top:.4rem;font-weight:700;font-size:.95rem}
ol.steps{padding-left:1.4rem}
ol.steps li{margin:.5rem 0}
.check{list-style:none;padding:0}
.check li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule)}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--spruce)}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin:.6rem 0}
th,td{text-align:left;vertical-align:top;padding:7px 6px;border-bottom:1px solid var(--rule)}
th{color:var(--ink2);font-weight:700}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.toc a{padding:6px 12px;border:1.5px solid var(--rule);border-radius:999px;text-decoration:none;font-size:.9rem;background:var(--paper);color:var(--ink)}
.callout{border-left:4px solid var(--bud);background:var(--bud-soft);padding:10px 12px;border-radius:0 6px 6px 0;margin:12px 0}
.callout.g{border-color:var(--spruce);background:var(--spruce-soft)}

/* charts */
.elev{position:relative;margin:10px 0 6px}
.elev-sites{position:relative;height:58px}
.elev-sites span{position:absolute;transform:translateX(-50%);font-size:.72rem;line-height:1.15;text-align:center;white-space:nowrap}
.elev-sites span.r2{top:28px}
.elev-sites span b{display:block;font-weight:700}
.elev-body{position:relative}
.elev-line{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--ink2);opacity:.45}
.elev-row{position:relative;padding:3px 0 6px}
.elev-name{font-size:.82rem;line-height:1.2}
.elev-name i{font-family:var(--serif);color:var(--ink2)}
.elev-track{position:relative;height:10px;background:var(--track);border-radius:5px;margin-top:3px}
.elev-track b{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--ink2)}
.elev-track b.hi{background:var(--spruce)}
.elev-track b.open{border-top-left-radius:0;border-bottom-left-radius:0}
.elev-axis{position:relative;height:34px;border-top:1px solid var(--ink2);font-size:.7rem;color:var(--ink2)}
.elev-axis span{position:absolute;transform:translateX(-50%);top:3px;text-align:center;line-height:1.15}
.phen{display:grid;grid-template-columns:minmax(0,1fr) repeat(12,18px);gap:2px 2px;align-items:center;font-size:.8rem;margin:8px 0}
.phen .mh{font-size:.68rem;color:var(--ink2);text-align:center}
.phen .mh.nov{color:var(--ink);font-weight:700}
.phen .nm2{padding-right:6px;line-height:1.15;overflow-wrap:anywhere}
.phen .c{height:14px;background:var(--track);border-radius:2px}
.phen .c.f{background:var(--spruce)}
.phen .c.nov{box-shadow:inset 0 0 0 2px var(--hazel)}
.phen .c.f.nov{background:var(--hazel)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--ink2);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* conifer panels */
.conifer{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.conifer:last-child{border-bottom:0}
.conifer svg{width:150px;height:96px}
.conifer .nm{font-size:.95rem}
.conifer p{font-size:.88rem;margin:.15rem 0}
.draw{stroke:var(--ink2);fill:none;stroke-linecap:round}
.draw .cone{fill:var(--track);stroke:var(--ink2)}

/* lightbox */
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.94);display:flex;flex-direction:column;justify-content:center;color:#fff}
#lb[hidden]{display:none}
#lb img{max-height:78vh;width:100%;object-fit:contain}
#lb .cap{padding:10px 16px;font-size:.85rem}
#lb .cap a{color:#fff}
#lb .x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:50%;width:44px;height:44px;font-size:1.4rem;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body class="l-both">
<header class="top"><div class="row">
  <a class="brand" href="#plants">Blue Ridge</a>
  <div class="langs" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="es">ES</button><button data-lang="both">EN+ES</button>
  </div>
</div></header>

<main id="app" class="wrap" tabindex="-1"></main>

<nav class="tabs" aria-label="Sections">
  <a href="#plants" data-tab="plants"><svg viewBox="0 0 24 24"><path d="M12 21V9"/><path d="M12 9c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 13c0-3-2.5-5-6-5 0 3.5 2.5 5 6 5z"/></svg><span class="en">Plants</span><span class="es">Plantas</span></a>
  <a href="#places" data-tab="places"><svg viewBox="0 0 24 24"><path d="M3 20l6-12 4 7 3-4 5 9z"/><circle cx="17" cy="6" r="2"/></svg><span class="en">Places</span><span class="es">Lugares</span></a>
  <a href="#rules" data-tab="rules"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span class="en">Rules</span><span class="es">Reglas</span></a>
  <a href="#kit" data-tab="kit"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5h6v2"/><path d="M4 12h16"/></svg><span class="en">Field kit</span><span class="es">Campo</span></a>
  <a href="#more" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span class="en">More</span><span class="es">Más</span></a>
</nav>

<div id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <button class="x" aria-label="Close">×</button>
  <img alt="">
  <div class="cap"></div>
</div>

<script src="species.js"></script>
<script>
(function(){
'use strict';
const SP = window.SPECIES, GR = window.GROUPS, byId = {};
SP.forEach(s => byId[s.id] = s);
const BBOX = 'swlat=35.2&swlng=-83.3&nelat=36.7&nelng=-81.2';
const IMG_CACHE = 'brg-img-v1';
const app = document.getElementById('app');
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const enc = encodeURIComponent;

/* ---------- language ---------- */
let lang = store.get('brg-lang', 'both');
function setLang(l){
  lang = l; store.set('brg-lang', l);
  document.body.className = 'l-' + l;
  document.documentElement.lang = l === 'es' ? 'es' : 'en';
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));
}
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => { const y = window.scrollY; setLang(b.dataset.lang); route(); window.scrollTo(0, y); });
setLang(lang);

/* text helpers: [English, Spanish] */
const S = p => p ? `<span class="en">${p[0]}</span><span class="es alt">${p[1]}</span>` : '';
const P = (p, cls) => p ? `<p class="en ${cls||''}">${p[0]}</p><p class="es ${cls||''}">${p[1]}</p>` : '';
const H2 = (p, id) => `<h2${id ? ` id="${id}"` : ''}>${S(p)}</h2>`;
const H3 = p => `<h3>${S(p)}</h3>`;
const LI = p => `<li><span class="en blk">${p[0]}</span><span class="es blk">${p[1]}</span></li>`;
const dotNum = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const comNum = n => n.toLocaleString('en-US');
const toM = ft => Math.round(ft * 0.3048 / 10) * 10;
function elevText(el){
  if(!el) return null;
  const [lo, hi, open] = el;
  if(open) return [`From the foothills to about ${comNum(hi)} ft (${comNum(toM(hi))} m)`, `Desde las estribaciones hasta unos ${dotNum(toM(hi))} m`];
  return [`About ${comNum(lo)} to ${comNum(hi)} ft (${comNum(toM(lo))} to ${comNum(toM(hi))} m)`, `Unos ${dotNum(toM(lo))} a ${dotNum(toM(hi))} m`];
}
const MON_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const STATUS = { E:['Endemic','Endémica'], N:['Near endemic','Casi endémica'], C:['Common','Común'], R:['Rare, protected','Rara, protegida'] };
const CODES = {
  X:['Never collect: photo only','No recolectar: solo foto'],
  P:['Sample only with written permission on private land','Muestra solo con permiso escrito en terreno privado'],
  B:['Buy a legal sample from a farm or nursery','Compren una muestra legal en finca o vivero']
};
const common = s => lang === 'es' ? s.es : s.en;

/* ---------- images: Wikipedia lead images ---------- */
let WIKI = store.get('brg-wiki', null);
const wikiTitle = s => s.wk || s.sci;
async function fetchJSON(url, ms){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms || 15000);
  try{ const r = await fetch(url, {signal: ctl.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
async function loadWiki(force){
  if(WIKI && !force && Date.now() - (WIKI.t || 0) < 1000*60*60*24*30) return WIKI;
  try{
    const titles = SP.map(wikiTitle);
    const q = await fetchJSON('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail|name&pithumbsize=960&titles=' + enc(titles.join('|')));
    const norm = {}, red = {}, pages = {};
    (q.query.normalized || []).forEach(n => norm[n.from] = n.to);
    (q.query.redirects || []).forEach(n => red[n.from] = n.to);
    Object.values(q.query.pages || {}).forEach(p => pages[p.title] = p);
    const out = { t: Date.now(), img: {} };
    SP.forEach(s => {
      let t = wikiTitle(s); t = norm[t] || t; t = red[t] || t;
      const p = pages[t];
      if(p && p.thumbnail) out.img[s.id] = { src: p.thumbnail.source, file: p.pageimage || '', page: t };
    });
    const files = [...new Set(Object.values(out.img).map(i => i.file).filter(Boolean))];
    if(files.length){
      try{
        const c = await fetchJSON('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=extmetadata&iiextmetadatafilter=Artist|LicenseShortName&titles=' + enc(files.map(f => 'File:' + f).join('|')));
        const meta = {};
        Object.values(c.query.pages || {}).forEach(p => {
          const m = p.imageinfo && p.imageinfo[0] && p.imageinfo[0].extmetadata;
          if(m) meta[p.title.replace(/^File:/, '').replace(/ /g, '_')] = {
            artist: m.Artist ? m.Artist.value.replace(/<[^>]*>/g, '').trim() : '',
            lic: m.LicenseShortName ? m.LicenseShortName.value : '' };
        });
        Object.values(out.img).forEach(i => { const m = meta[i.file.replace(/ /g, '_')]; if(m){ i.artist = m.artist; i.lic = m.lic; } });
      }catch(e){}
    }
    WIKI = out; store.set('brg-wiki', out);
  }catch(e){ if(!WIKI) WIKI = { t: 0, img: {} }; }
  return WIKI;
}
const small = src => src.replace(/\/(\d+)px-/, '/250px-');
function heroOf(id){ return WIKI && WIKI.img[id]; }

/* ---------- images: iNaturalist observations ---------- */
const LIC = 'cc0,cc-by,cc-by-nc,cc-by-sa,cc-by-nc-sa,cc-by-nd,cc-by-nc-nd';
function inatURL(s, season, local){
  return 'https://api.inaturalist.org/v1/observations?photos=true&quality_grade=research&order_by=votes&per_page=12'
    + '&photo_license=' + LIC + '&taxon_name=' + enc(s.inat || s.sci)
    + (season === 'late' ? '&month=10,11,12' : '') + (local ? '&' + BBOX : '');
}
async function loadInat(s, season){
  const key = 'brg-inat-' + s.id + '-' + season;
  const cached = store.get(key, null);
  if(cached && Date.now() - cached.t < 1000*60*60*24*30) return cached;
  try{
    let res = await fetchJSON(inatURL(s, season, true)); let local = true;
    if((res.results || []).length < 4){ res = await fetchJSON(inatURL(s, season, false)); local = false; }
    const photos = [];
    (res.results || []).forEach(o => {
      const ph = (o.photos || [])[0]; if(!ph || !ph.url) return;
      photos.push({ m: ph.url.replace('/square.', '/medium.'), l: ph.url.replace('/square.', '/large.'),
        a: ph.attribution || '', o: o.uri || ('https://www.inaturalist.org/observations/' + o.id),
        d: o.observed_on || '', p: o.place_guess || '' });
    });
    const out = { t: Date.now(), local, photos };
    store.set(key, out); return out;
  }catch(e){ return cached || { t: 0, local: false, photos: [], err: true }; }
}

function coniferPanels(){
  const twig = (kind) => {
    let n = '';
    for(let k = 0; k < 14; k++){
      const x = 14 + k * 9;
      if(kind === 'fir'){ if(Math.abs(x - 75) > 12) n += `<line x1="${x}" y1="58" x2="${x+3}" y2="42"/>`; n += `<line x1="${x}" y1="62" x2="${x+3}" y2="78"/>`; }
      if(kind === 'spruce'){ n += `<line x1="${x}" y1="59" x2="${x+8}" y2="49"/><line x1="${x+2}" y1="60" x2="${x+11}" y2="58"/>`; if(Math.abs(x + 4 - 80) > 11) n += `<line x1="${x}" y1="61" x2="${x+8}" y2="71"/>`; }
      if(kind === 'hem'){ n += `<line x1="${x}" y1="60" x2="${x-2}" y2="52"/><line x1="${x}" y1="60" x2="${x+4}" y2="52"/>`; if(Math.abs(x - 112) > 9) n += `<line x1="${x}" y1="60" x2="${x-2}" y2="68"/><line x1="${x}" y1="60" x2="${x+4}" y2="68"/>`; }
    }
    const w = kind === 'fir' ? 2.4 : kind === 'spruce' ? 1.4 : 1.9;
    let cone = '';
    if(kind === 'fir') cone = `<rect class="cone" x="66" y="18" width="18" height="40" rx="8"/>` + [0,1,2,3].map(j => `<path d="M66 ${25+j*8}q-5 1 -5 5M84 ${25+j*8}q5 1 5 5"/>`).join('');
    if(kind === 'spruce') cone = `<line x1="80" y1="61" x2="80" y2="65"/><rect class="cone" x="72" y="65" width="16" height="30" rx="7"/>` + [0,1,2].map(j => `<path d="M73 ${72+j*7}q7 4 14 0"/>`).join('');
    if(kind === 'hem') cone = `<line x1="112" y1="61" x2="112" y2="64"/><rect class="cone" x="105" y="64" width="14" height="20" rx="6"/>` + [0,1].map(j => `<path d="M105 ${70+j*6}l-4 2M119 ${70+j*6}l4 2"/>`).join('');
    return `<svg viewBox="0 0 150 96" class="draw" aria-hidden="true"><g stroke-width="${w}">${n}</g><line x1="10" y1="60" x2="140" y2="60" stroke-width="2.6"/><g stroke-width="1.2">${cone}</g></svg>`;
  };
  const row = (kind, id, en, es) => `<div class="conifer">${twig(kind)}<div><a class="nm" href="#plant/${id}">${S([byId[id].en, byId[id].es])}</a>${P([en, es])}</div></div>`;
  return row('fir','abies-fraseri','Flat, soft needles that will not roll. Cone stands upright and falls apart on the branch.','Agujas planas y suaves que no ruedan. Cono erguido que se deshace en la rama.')
    + row('spruce','picea-rubens','Four sided, sharp needles that roll. Cone hangs and falls whole.','Agujas de cuatro lados, punzantes, que ruedan. Cono colgante que cae entero.')
    + row('hem','tsuga-caroliniana','Short needles all around the twig; tangerine scent. Small hanging cone with scales open wide. Eastern hemlock: needles in two flat rows.','Agujas cortas alrededor de la ramita; olor a mandarina. Cono pequeño colgante con escamas abiertas. Tsuga del este: agujas en dos filas planas.')
    + P(['Schematic drawings, not to scale.','Dibujos esquemáticos, sin escala.'], 'note');
}
function leafDrawing(){
  const u = 36, x0 = 40;
  const L = [
    { id:'rhododendron-catawbiense', min:3, max:6, r:.17, sh:'round', en:'Rounded at both ends', es:'Redondeada en ambos extremos' },
    { id:'rhododendron-maximum', min:4, max:8, r:.15, sh:'taper', en:'Tapered base, pointed tip', es:'Base angosta, punta aguda' },
    { id:'kalmia-latifolia', min:2, max:5, r:.17, sh:'point', en:'Pointed at both ends', es:'Aguda en ambos extremos' }];
  const path = (sh, y, len, h) => { const a = x0, b = x0 + len, Lq = len;
    if(sh === 'round') return `M${a} ${y}C${a} ${y-.75*h} ${a+.15*Lq} ${y-h} ${a+.5*Lq} ${y-h}C${a+.85*Lq} ${y-h} ${b} ${y-.75*h} ${b} ${y}C${b} ${y+.75*h} ${a+.85*Lq} ${y+h} ${a+.5*Lq} ${y+h}C${a+.15*Lq} ${y+h} ${a} ${y+.75*h} ${a} ${y}Z`;
    if(sh === 'taper') return `M${a} ${y}C${a+.3*Lq} ${y-.3*h} ${a+.4*Lq} ${y-h} ${a+.6*Lq} ${y-h}C${a+.85*Lq} ${y-h} ${a+.95*Lq} ${y-.4*h} ${b} ${y}C${a+.95*Lq} ${y+.4*h} ${a+.85*Lq} ${y+h} ${a+.6*Lq} ${y+h}C${a+.4*Lq} ${y+h} ${a+.3*Lq} ${y+.3*h} ${a} ${y}Z`;
    return `M${a} ${y}C${a+.2*Lq} ${y-.7*h} ${a+.35*Lq} ${y-h} ${a+.5*Lq} ${y-h}C${a+.65*Lq} ${y-h} ${a+.8*Lq} ${y-.7*h} ${b} ${y}C${a+.8*Lq} ${y+.7*h} ${a+.65*Lq} ${y+h} ${a+.5*Lq} ${y+h}C${a+.35*Lq} ${y+h} ${a+.2*Lq} ${y+.7*h} ${a} ${y}Z`; };
  let g = '', y = 0;
  L.forEach(l => {
    const len = (l.min + l.max) / 2 * u, h = len * l.r, s = byId[l.id];
    y += h + 40;
    g += `<text x="${x0}" y="${y - h - 24}" class="lt">${lang === 'es' ? s.es : s.en}</text><text x="${x0}" y="${y - h - 9}" class="ls">${lang === 'es' ? l.es : l.en}</text>`;
    g += `<line x1="${x0-10}" y1="${y}" x2="${x0}" y2="${y}" stroke-width="2"/><path d="${path(l.sh, y, len, h)}" class="cone" stroke-width="1.2"/><line x1="${x0}" y1="${y}" x2="${x0+len-4}" y2="${y}" stroke-width=".8"/>`;
    const by = y + h + 10;
    g += `<line x1="${x0+l.min*u}" y1="${by}" x2="${x0+l.max*u}" y2="${by}" stroke="var(--spruce)" stroke-width="3"/><text x="${x0}" y="${by+15}" class="ls">${lang === 'es' ? `${l.min} a ${l.max} pulg. (${Math.round(l.min*2.54)} a ${Math.round(l.max*2.54)} cm)` : `${l.min} to ${l.max} in (${Math.round(l.min*2.54)} to ${Math.round(l.max*2.54)} cm)`}</text>`;
    y = by + 22;
  });
  y += 24;
  let ax = `<line x1="${x0}" y1="${y-10}" x2="${x0+8*u}" y2="${y-10}" stroke-width="1"/>`;
  for(let t = 0; t <= 8; t++) ax += `<line x1="${x0+t*u}" y1="${y-10}" x2="${x0+t*u}" y2="${y-5}"/><text x="${x0+t*u}" y="${y+6}" class="ls" text-anchor="middle">${t}</text>`;
  ax += `<text x="${x0+8*u}" y="${y+20}" class="ls" text-anchor="end">inches (2.54 cm each)</text>`;
  return `<svg viewBox="0 0 360 ${y+28}" class="draw" role="img" aria-label="Leaf outlines of three evergreen shrubs at true relative size"><style>.lt{font:700 12px var(--sans);fill:var(--ink);stroke:none}.ls{font:11px var(--sans);fill:var(--ink2);stroke:none}</style>${g}${ax}</svg>`
    + P(['Leaves drawn at the middle of their length range, on one scale; the green bar shows the full range.','Hojas dibujadas en el punto medio de su rango de longitud, en una misma escala; la barra verde muestra el rango completo.'], 'note');
}

function exportNotes(){
  const q = v => '"' + String(v || '').replace(/"/g, '""') + '"';
  const rows = [['id','scientific_name','common_name','seen_on','notes','last_edit']];
  SP.forEach(s => { if(SEEN[s.id] || NOTES[s.id]) rows.push([s.id, s.sci, s.en, SEEN[s.id] || '', NOTES[s.id] && NOTES[s.id].txt, NOTES[s.id] && NOTES[s.id].at]); });
  const blob = new Blob([rows.map(r => r.map(q).join(',')).join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'blue-ridge-notes.csv'; a.click();
}

function elevChart(){

  return `<div class="elev"><div class="elev-sites">${sites.map(s => `<span class="r${s[2]}" style="left:${pct(s[1])}%"><b>${s[0]}</b>${comNum(s[1])} ft</span>`).join('')}</div>

    <div class="elev-axis">${[1000,2000,3000,4000,5000,6000,7000].map(t => `<span style="left:${pct(t)}%">${comNum(t)} ft<br>${dotNum(toM(t))} m</span>`).join('')}</div></div>

}
function phenChart(){
  const rows = SP.filter(s => s.fl);
  const mon = lang === 'es' ? MON_ES : MON_EN;
  let h = `<div class="phen"><span></span>${mon.map((m, i) => `<span class="mh ${i === 10 ? 'nov' : ''}">${m.charAt(0).toUpperCase()}</span>`).join('')}`;
  rows.forEach(s => {
    h += `<a class="nm2" href="#plant/${s.id}">${common(s)}</a>`;
    for(let m = 1; m <= 12; m++){ const on = m >= s.fl[0] && m <= s.fl[1]; h += `<span class="c ${on ? 'f' : ''} ${m === 11 ? 'nov' : ''}" title="${mon[m-1]}"></span>`; }
  });
  return h + `</div><div class="legend"><span><i style="background:var(--spruce)"></i>${S(['Flowering (pollen for conifers)','Floración (polen en coníferas)'])}</span><span><i style="background:var(--track);box-shadow:inset 0 0 0 2px var(--hazel)"></i>${S(['November','Noviembre'])}</span></div>`;
}

/* ---------- offline save ---------- */
async function saveOffline(){
  const msg = document.getElementById('savemsg'), bar = app.querySelector('.prog'), fill = bar.querySelector('i');
  const say = p => { if(msg) msg.innerHTML = S(p); };
  if(!('caches' in window)){ say(['This browser cannot store photos offline. Open the page from its https address.','Este navegador no puede guardar fotos. Abran la página desde su dirección https.']); return; }
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  bar.hidden = false; say(['Collecting photo lists','Reuniendo listas de fotos']);
  await loadWiki(true);
  const urls = new Set();
  let i = 0;
  for(const s of SP){
    const h = heroOf(s.id); if(h){ urls.add(h.src); urls.add(small(h.src)); }
    const d = await loadInat(s, 'late');
    let ph = d.photos;
    if(ph.length < 3){ const all = await loadInat(s, 'all'); ph = ph.concat(all.photos); }
    ph.slice(0, 6).forEach(p => urls.add(p.m));
    i++; fill.style.width = (i / SP.length * 30) + '%';
  }
  const list = [...urls]; let done = 0, failed = 0;
  const cache = await caches.open(IMG_CACHE);
  const work = async () => {
    while(list.length){
      const u = list.pop();
      try{ if(!(await cache.match(u))){ const r = await fetch(u, {mode:'no-cors'}); await cache.put(u, r); } }catch(e){ failed++; }
      done++; fill.style.width = (30 + done / urls.size * 70) + '%';
      say([`Saved ${done} of ${urls.size} photos`, `Guardadas ${done} de ${urls.size} fotos`]);
    }
  };
  await Promise.all([work(), work(), work(), work()]);
  say(failed ? [`Done. ${failed} photos could not be saved; try again later.`, `Listo. ${failed} fotos no se pudieron guardar; intenten más tarde.`]
             : ['Done. Photos and lists are saved on this phone.','Listo. Fotos y listas guardadas en este teléfono.']);
  store.set('brg-saved', Date.now());
}
